<!-- Partner Portal Api Invoice Viewer -->
<template>
    <lightning-spinner if:true={isLoading} alternative-text="Loading" size="medium"></lightning-spinner>

    <lightning-card title="Atlassian Partner Portal Invoices via API" icon-name="custom:custom14">
        <template if:true={invoiceResults.missingAccountId}>
            <h2 class="slds-text-color_error">{invoiceResults.error}</h2>
        </template>

        <template if:true={invoiceResults.error}>
            <template if:false={invoiceResults.missingAccountId}>
                <h2 class="slds-text-color_error slds-m-bottom_small">{invoiceResults.error}</h2>
            </template>
        </template>

        <template if:false={invoiceResults.missingAccountId}>
            <template if:true={hasInvoiceData}>
            <div class="conv-result">
                <h1>Invoices found through API</h1>
                <div class="rounded-rect">
                    <table>
                        <thead>
                        <tr>
                            <th>Invoice Id</th>
                            <th>Invoice #</th>
                            <th>Type</th>
                            <th>Status</th>
                            <th>Paid At</th>
                            <th class="number"># Line Items</th>
                            <th class="currency">Tax</th>
                            <th class="currency">SubTotal</th>
                            <th class="currency">Total</th>
                            <th class="left-pad">Currency</th>
                            <th class="left-pad">Preview</th>
                        </tr>
                        </thead>
                        <tbody>
                            <template for:each={invoiceResults.data} for:item="inv">
                                <tr key={inv.id} class={inv.rowClass}>
                                    <td>{inv.id}</td>
                                    <td>{inv.invoiceNumber}</td>
                                    <td>{inv.paymentMethodObj.type}</td>
                                    <td>{inv.status}</td>
                                    <td>{inv.paidAtDate}</td>
                                    <td class="currency">{inv.length}</td>
                                    <td class="currency">{inv.tax}</td>
                                    <td class="currency">{inv.subTotal}</td>
                                    <td class="currency">{inv.total}</td>
                                    <td class="left-pad">{inv.isoCurrency}</td>
                                    <td class="button-around">
                                        <lightning-button
                                                label="Preview"
                                                onclick={handlePreview}
                                                variant="neutral"
                                                data-id={inv.id}
                                                data-office={inv.office}
                                        ></lightning-button>
                                    </td>
                                </tr>
                                <tr key={inv.invoiceNumber}>
                                    <td colspan=100>
                                        <template if:true={inv.tooLargeToLoad}>
                                            <p class="slds-text-color_error slds-p-around_small">{inv.loadError}</p>
                                        </template>
                                        <template if:false={inv.tooLargeToLoad}>
                                        <table class="table-green">
                                            <thead>
                                                <tr>
                                                    <th class="td-indent">&nbsp;</th>
                                                    <th class="td-id">Id</th>
                                                    <th>Description</th>
                                                    <th>Atlassian Offering</th>
                                                    <th>Atlassian Product</th>
                                                    <th>Salesforce Product</th>
                                                    <th>Interval</th>
                                                    <th class="td-pad">Starts At</th>
                                                    <th class="td-pad">Ends At</th>
                                                    <th class="number">Quantity</th>
                                                    <th class="currency">Tax</th>
    <!--                                                <th class="currency">Unit Amount</th>-->
                                                    <th class="currency">SubTotal</th>
                                                    <th class="currency">Total</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template for:each={inv.items} for:item="li">
                                                    <tr key={li.id} class="border">
                                                        <td class="td-indent">&nbsp;</td>
                                                        <td>{li.id}</td>
                                                        <td>{li.description}</td>
                                                        <td>
                                                            <a href={li.offeringId} target="_blank" rel="noopener noreferrer">
                                                                {li.offeringName}
                                                            </a>
                                                        </td>
                                                        <td>{li.productName}</td>
                                                        <td>{li.sfProductName}</td>
                                                        <td>{li.planObj.cycle.interval}</td>
                                                        <td class="td-pad">{li.startAtStr}</td>
                                                        <td class="td-pad">{li.endAtStr}</td>
                                                        <td class="number">{li.quantity}</td>
                                                        <td class="number">{li.tax}</td>
    <!--                                                    <td class="currency">{li.unitAmount}</td>-->
                                                        <td class="currency">{li.subTotal}</td>
                                                        <td class="currency">{li.total}</td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                        <template if:true={inv.truncationMessage}>
                                            <p class="slds-text-color_weak slds-p-around_x-small">{inv.truncationMessage}</p>
                                        </template>
                                        </template>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
            </template>
            <template if:true={showLoadMore}>
                <div class="slds-m-top_medium slds-text-align_center">
                    <lightning-button
                        label="Load more invoices"
                        onclick={handleLoadMore}
                        variant="neutral"
                        disabled={isLoadingMore}
                    ></lightning-button>
                </div>
            </template>
        </template>
    </lightning-card>
</template>
