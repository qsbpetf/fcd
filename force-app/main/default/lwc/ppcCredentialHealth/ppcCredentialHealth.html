<template>
    <lightning-card title="Atlassian PPC credential health" icon-name="custom:custom18">
        <div slot="actions">
            <lightning-button
                label="Probe now"
                variant="brand"
                disabled={probeDisabled}
                onclick={handleProbeNow}
            ></lightning-button>
        </div>

        <div class="slds-p-horizontal_medium slds-p-bottom_small">
            <p class="slds-text-body_small slds-text-color_weak">
                Last refreshed {lastRefreshedLabel}
                <template if:true={isProbing}> · probing named credentials…</template>
            </p>
            <template if:true={errorMessage}>
                <div class="slds-text-color_error slds-m-top_xx-small">{errorMessage}</div>
            </template>
        </div>

        <template if:true={isLoading}>
            <div class="slds-p-around_medium">
                <lightning-spinner alternative-text="Loading credential status" size="small"></lightning-spinner>
            </div>
        </template>

        <template if:true={hasRows}>
            <div class="status-grid slds-p-horizontal_medium slds-p-bottom_medium">
                <template for:each={displayRows} for:item="row">
                    <article key={row.id} class={row.cardClass}>
                        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                            <h3 class="slds-text-heading_small">{row.subsidiaryLabel}</h3>
                            <span class={row.badgeClass}>{row.statusLabel}</span>
                        </div>
                        <p class="slds-text-body_small slds-m-top_xx-small">{row.namedCredentialName}</p>
                        <dl class="slds-m-top_small meta">
                            <div>
                                <dt>HTTP</dt>
                                <dd>{row.httpStatusDisplay}</dd>
                            </div>
                            <div>
                                <dt>Checked</dt>
                                <dd>{row.lastCheckedLabel}</dd>
                            </div>
                            <div>
                                <dt>Time</dt>
                                <dd>{row.responseTimeLabel}</dd>
                            </div>
                            <div>
                                <dt>Failures</dt>
                                <dd>{row.consecutiveFailures}</dd>
                            </div>
                        </dl>
                        <template if:true={row.isStale}>
                            <p class="slds-text-color_error slds-text-body_small slds-m-top_small">
                                Status is stale — scheduled probe may not be running.
                            </p>
                        </template>
                        <template if:true={row.errorMessage}>
                            <p class="error-snippet slds-m-top_small" title={row.errorMessage}>{row.errorMessage}</p>
                        </template>
                    </article>
                </template>
            </div>
        </template>

        <template if:true={showEmpty}>
            <div class="slds-p-around_medium slds-text-align_center slds-text-color_weak">
                No credential status records yet. Click Probe now or wait for the scheduled job.
            </div>
        </template>
    </lightning-card>
</template>
